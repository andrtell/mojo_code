[workspace]
authors = ["andrtell <116459057+andrtell@users.noreply.github.com>"]
channels = ['conda-forge', 'https://conda.modular.com/max']
name = "mojo_algo"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
format = "sh -c 'find -P -type f -name \"*.mojo\" -exec mojo format --quiet {} \\;'"
tests = "sh -c 'find tests -name \"test_*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"

[dependencies]
mojo = ">=1.2.0,<2"
